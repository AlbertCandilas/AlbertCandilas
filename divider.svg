<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" role="img" aria-label="divider">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#9D4EDD" stop-opacity="0"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#9D4EDD" stop-opacity="0"/></linearGradient>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#F5F3FF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F3FF" stop-opacity="0"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#C084FC" stop-opacity=".8"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
<filter id="gl" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.l{animation:sw 3.6s cubic-bezier(.6,0,.4,1) infinite}.r{animation:sw2 3.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sw{from{transform:translateX(-180px)}to{transform:translateX(450px)}}
@keyframes sw2{from{transform:translateX(900px)}to{transform:translateX(270px)}}
.gem{transform-box:fill-box;transform-origin:center;animation:gem 3.6s ease-in-out infinite}
@keyframes gem{0%,40%{transform:rotate(0) scale(1)}50%{transform:rotate(90deg) scale(1.5)}60%,100%{transform:rotate(90deg) scale(1)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 3.6s ease-out infinite}
@keyframes halo{0%,45%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.8)}}
.dot{animation:dot 2.4s ease-in-out infinite}@keyframes dot{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="30" y="19" width="840" height="2" fill="url(#g)" filter="url(#gl)"/>
<rect class="l" x="0" y="19" width="180" height="2" fill="url(#s)" filter="url(#gl)"/>
<rect class="r" x="0" y="19" width="180" height="2" fill="url(#s)" filter="url(#gl)"/>
<circle class="halo" cx="450" cy="20" r="18" fill="url(#halo)"/>
<path class="gem" d="M450 10 L460 20 L450 30 L440 20 Z" fill="#E9D5FF" stroke="#A855F7" stroke-width="1.5" filter="url(#gl)"/>
<circle class="dot" cx="400" cy="20" r="2" fill="#C084FC"/><circle class="dot" cx="500" cy="20" r="2" fill="#C084FC" style="animation-delay:-1.2s"/>
<circle class="dot" cx="370" cy="20" r="1.4" fill="#C084FC" style="animation-delay:-.6s"/><circle class="dot" cx="530" cy="20" r="1.4" fill="#C084FC" style="animation-delay:-1.8s"/>
</svg>
