  .n{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:900;fill:#D8B4FE}
  .chip rect{fill:#1A1030;stroke:#9D4EDD;stroke-opacity:.7}
  .chip text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;fill:#E9D5FF}
  .chip{animation:blink 2.8s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.75}50%{opacity:1}}
  .msg{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:14px;fill:#C084FC}
  .cur{animation:caret 1s steps(1) infinite}
  @keyframes caret{50%{opacity:0}}
  .scan{animation:scan 5s linear infinite}
  @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(456px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.p{opacity:.5}}
</style>
