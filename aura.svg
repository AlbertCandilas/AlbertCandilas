<svg xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456" role="img" aria-label="System window: player status of Alberto M. Candilas">
<defs>
  <radialGradient id="a1"><stop offset="0" stop-color="#9D4EDD" stop-opacity=".6"/><stop offset="1" stop-color="#9D4EDD" stop-opacity="0"/></radialGradient>
  <radialGradient id="a2"><stop offset="0" stop-color="#4C1D95" stop-opacity=".75"/><stop offset="1" stop-color="#4C1D95" stop-opacity="0"/></radialGradient>
  <radialGradient id="a3"><stop offset="0" stop-color="#2563EB" stop-opacity=".25"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#4C1D95"/><stop offset=".5" stop-color="#E9D5FF"/><stop offset="1" stop-color="#4C1D95"/></linearGradient>
  <linearGradient id="nameg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#E9D5FF"/><stop offset=".42" stop-color="#C084FC"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset=".58" stop-color="#C084FC"/><stop offset="1" stop-color="#E9D5FF"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="3s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="xp" x1="0" x2="1"><stop offset="0" stop-color="#4C1D95"/><stop offset=".7" stop-color="#A855F7"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bolt" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="clip"><rect width="900" height="456" rx="18"/></clipPath>
  <clipPath id="reveal"><rect x="40" y="110" width="0" height="70"><animate attributeName="width" from="0" to="620" dur="1.6s" begin="0.2s" fill="freeze"/></rect></clipPath>
  <clipPath id="typed"><rect x="60" y="404" width="0" height="26"><animate attributeName="width" values="0;0;560;560;0" keyTimes="0;.15;.55;.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<style>
  .aura{transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}
  .aura.b{animation-duration:8s;animation-delay:-3s} .aura.c{animation-duration:10s;animation-delay:-5s}
  @keyframes breathe{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
  .p{animation:rise linear infinite;opacity:0}
  @keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}80%{opacity:.5}100%{transform:translate(var(--dx),-486px);opacity:0}}
  .bolt{opacity:0;animation:flash 6.2s steps(1) infinite}
  @keyframes flash{0%{opacity:0}2%{opacity:1}3%{opacity:.2}4%{opacity:1}6%{opacity:0}100%{opacity:0}}
  .flashbg{opacity:0;animation:bgflash 6.2s ease-out infinite}
  @keyframes bgflash{0%{opacity:0}2%{opacity:.18}8%{opacity:0}100%{opacity:0}}
  .ring{transform-box:view-box;transform-origin:745px 250px;fill:none;stroke:#9D4EDD}
  .r1{animation:spin 26s linear infinite;stroke-opacity:.2;stroke-dasharray:4 10}
  .r2{animation:spin 18s linear infinite reverse;stroke-opacity:.28}
  .r3{animation:spin 40s linear infinite;stroke-opacity:.15;stroke-dasharray:60 20}
  .runes{transform-box:view-box;transform-origin:745px 250px;animation:spin 18s linear infinite reverse;fill:#C084FC;fill-opacity:.3}
  @keyframes spin{to{transform:rotate(360deg)}}
  .border{fill:none;stroke:url(#edge);stroke-width:2.2;stroke-dasharray:380 200;animation:flow 5s linear infinite}
  .border.b2{animation-delay:-2.5s;stroke-opacity:.7}
  @keyframes flow{to{stroke-dashoffset:-1160}}
  .frame{fill:none;stroke:#9D4EDD;stroke-opacity:.3}
  .hud{fill:none;stroke:#E9D5FF;stroke-width:2.5;stroke-linecap:round;animation:hud 3s ease-in-out infinite}
  @keyframes hud{50%{stroke:#C084FC;opacity:.6}}
  .sys{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:14px;letter-spacing:5px;fill:#D8B4FE;animation:sysb 2.4s ease-in-out infinite}
  @keyframes sysb{50%{opacity:.55}}
  .title{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:15px;letter-spacing:7px;fill:#A9A3C2}
  .name{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:40px;letter-spacing:2px}
  .gl{opacity:0;animation:glitch 4.5s steps(1) infinite}
  .gl.c{animation-delay:.06s}
  @keyframes glitch{0%{opacity:0}70%{opacity:.8;transform:translate(-3px,0)}71%{opacity:.8;transform:translate(3px,-1px)}72%{opacity:0}88%{opacity:.7;transform:translate(2px,1px)}89%{opacity:0}100%{opacity:0}}
  .k{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:13px;letter-spacing:2px;fill:#8B84A8}
  .v{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:600;fill:#F5F3FF}
  .n{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:24px;font-weight:900;fill:#E9D5FF}
  .rank{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:24px;font-weight:900;fill:#C084FC;animation:rk 2s ease-in-out infinite}
  @keyframes rk{50%{fill:#F5F3FF}}
  .chip rect{fill:#1A1030;stroke:#9D4EDD;stroke-opacity:.8}
  .chip text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;fill:#E9D5FF}
  .in{animation:fadein 1s ease-out both}
  @keyframes fadein{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  .msg{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:14px;fill:#C084FC}
  .scan{animation:scan 5s linear infinite}
  @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(456px)}}
  .xplbl{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:11px;letter-spacing:2px;fill:#8B84A8}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.p{opacity:.5}.gl,.bolt,.flashbg{opacity:0}}
</style>
<g clip-path="url(#clip)">
  <rect width="900" height="456" fill="#06050B"/>
  <ellipse class="aura" cx="240" cy="190" rx="340" ry="220" fill="url(#a2)"/>
  <ellipse class="aura b" cx="680" cy="260" rx="300" ry="210" fill="url(#a1)"/>
  <ellipse class="aura c" cx="450" cy="480" rx="480" ry="130" fill="url(#a1)"/>
  <ellipse class="aura b" cx="820" cy="60" rx="220" ry="140" fill="url(#a3)"/>
  <circle class="ring r3" cx="745" cy="250" r="150" stroke-width="1"/>
  <circle class="ring r1" cx="745" cy="250" r="128" stroke-width="2"/>
  <g class="ring r2" stroke-width="1.5"><circle cx="745" cy="250" r="112"/><circle cx="745" cy="250" r="96"/><line x1="857.0" y1="250.0" x2="841.0" y2="250.0"/><line x1="855.3" y1="269.4" x2="847.4" y2="268.1"/><line x1="850.2" y1="288.3" x2="842.7" y2="285.6"/><line x1="842.0" y1="306.0" x2="828.1" y2="298.0"/><line x1="830.8" y1="322.0" x2="824.7" y2="316.8"/><line x1="817.0" y1="335.8" x2="811.8" y2="329.7"/><line x1="801.0" y1="347.0" x2="793.0" y2="333.1"/><line x1="783.3" y1="355.2" x2="780.6" y2="347.7"/><line x1="764.4" y1="360.3" x2="763.1" y2="352.4"/><line x1="745.0" y1="362.0" x2="745.0" y2="346.0"/><line x1="725.6" y1="360.3" x2="726.9" y2="352.4"/><line x1="706.7" y1="355.2"
